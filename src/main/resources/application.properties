server.port=8080

# ---- data contract ----
dq.contract.version=v1
dq.contract.fields[0].name=id
dq.contract.fields[0].type=STRING
dq.contract.fields[0].required=true
dq.contract.fields[1].name=amount
dq.contract.fields[1].type=DOUBLE
dq.contract.fields[1].required=true
dq.contract.fields[2].name=category
dq.contract.fields[2].type=STRING
dq.contract.fields[2].required=false
dq.contract.fields[3].name=event_time
dq.contract.fields[3].type=TIMESTAMP
dq.contract.fields[3].required=true

# ---- quality checks (each independently toggleable) ----
dq.checks[0].type=COMPLETENESS
dq.checks[0].enabled=true
dq.checks[0].max-missing-ratio=0.0
dq.checks[1].type=UNIQUENESS
dq.checks[1].enabled=true
dq.checks[1].field=id
dq.checks[1].max-duplicate-ratio=0.0
dq.checks[2].type=RANGE
dq.checks[2].enabled=true
dq.checks[2].field=amount
dq.checks[2].min=0
dq.checks[2].max=10000
dq.checks[2].max-outlier-ratio=0.0
dq.checks[3].type=FRESHNESS
dq.checks[3].enabled=true
dq.checks[3].field=event_time
dq.checks[3].max-age-seconds=86400

# ---- drift monitoring ----
dq.drift.min-samples=20
dq.drift.numeric-shift-threshold=3.0
dq.drift.psi-threshold=0.25
dq.drift.baseline-strategy=ON_PASS
